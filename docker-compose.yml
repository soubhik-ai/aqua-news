services:
  news-aggregator:
    build: .
    ports:
      - "${PORT:-8501}:8501"
    volumes:
      - ./config:/app/config:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  fetcher:
    build:
      context: .
      dockerfile: Dockerfile.fetcher
    volumes:
      - ./config:/app/config:ro
    environment:
      - PYTHONUNBUFFERED=1
